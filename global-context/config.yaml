# Global Context — VANI memory layer configuration
# Every value can be overridden with an environment variable of the same
# name in UPPER_SNAKE_CASE prefixed with GCX_ (e.g. GCX_TOKEN_BUDGET=500).

data_dir: data/demo          # folder with gc_*.csv seller files (+ buyer getContext CSV)
db_path: .gcx/context.db     # SQLite store (events, sections, docs, freshness log)
out_dir: outputs             # where seller_md/ and buyer_md/ files are written

# ---- Lookback window (tiered) -------------------------------------------
# Tier 1  detail_days      : individual conversations, open threads
# Tier 2  pulse_windows    : counts / rates (30d and 90d)
# Tier 3  lifetime          : profile, KYC, categories, past objections
lookback:
  detail_days: 14
  thread_days: 21            # an unanswered question stays "open" this long
  pulse_windows: [30, 90]
  max_items_per_section: 4

token_budget: 450            # hard cap for the rendered .md (approx tokens)

# Clock: the dataset ends on 2 Oct 2026. "data" makes "now" = end of data +
# real time elapsed since the server started, so live demo events land
# "just now" on top of real history. Use "wall" in production.
clock: data
as_of: null                  # optional fixed ISO timestamp, e.g. 2026-10-02T23:59:00

# ---- Models ---------------------------------------------------------------
sarvam:
  base_url: https://api.sarvam.ai
  chat_model: sarvam-105b
  tts_model: bulbul:v4-flash   # conversational voices: more natural and faster than v3
  tts_fallback_model: bulbul:v3
  tts_speaker: priya           # v3 voice, used for languages without a v4 female voice and as fallback
  tts_voices:                  # Ananya's voice per language (Hindi + English share one person)
    hi-IN: ritu_hi_customer_warm
    en-IN: ritu_hi_customer_warm
    gu-IN: pooja_gu_conversational
    mr-IN: ishita_mr_conversational
    bn-IN: roopa_bn_conversational
    te-IN: kavitha_te_conversation
    kn-IN: chaitra_kn_conversation
  tts_language: hi-IN
  tts_pace: 1.0
  stt_model: saaras:v4
  stt_mode: codemix           # Hinglish-friendly output
  timeout_sec: 20
  llm_rpm: 35                 # local request budget per minute, a little under the Starter plan limits
  tts_rpm: 27                 # (sarvam-105b 40/min, bulbul:v3 30/min) — raise on Pro/Business
  stt_rpm: 55

# Sarvam Conversations ("Samvaad") voice agent — the real duplex call engine
# (dashboard.sarvam.ai → Voice Agents → your agent → Deploy with Code → Web SDK
# tab has these three ids pre-filled in its example snippet). Not secret: the
# frontend needs them to address the right agent; the API key stays server-side.
samvaad:
  org_id: "01a1110c-209c-7de3-844d-cbd1f15f165a"
  workspace_id: "01a1110c-20a4-7547-b624-024fbcef0dc5"
  app_id: "Payal---Glo-ed092fb2-9b6f"
  app_version: 3               # committed agent version Instant Outbound dials (Samvaad → agent → Versions)
  # Real phone calls (Instant Outbound). From indus.sarvam.ai → Deploy → Phone Numbers. Not secret.
  connection_id: ""            # GCX_SAMVAAD_CONNECTION_ID
  agent_phone_number: ""       # E.164, e.g. "+9180xxxxxxxx" — GCX_SAMVAAD_AGENT_PHONE_NUMBER
  # Public HTTPS base of this server (cloudflared / ngrok URL). Sarvam POSTs each call's outcome to
  # <public_url>/sarvam/outbound-webhook?token=<GCX_TUNNEL_TOKEN>. Quick-tunnel URLs change on restart:
  # set GCX_PUBLIC_URL in the shell instead of editing this file.
  public_url: "https://beginner-accountability-english-choices.trycloudflare.com"

# Optional fallback LLM (any OpenAI-compatible endpoint). Used only when the
# Sarvam key is missing or a Sarvam call fails.
fallback_llm:
  base_url: null
  model: null
